<figure class="diagram" id="fig-fer">
  <svg viewBox="0 0 640 150" role="img" aria-labelledby="ff-t" aria-describedby="ff-d">
    <title id="ff-t">Le calcul du fer</title>
    <desc id="ff-d">Comparaison sur échelle logarithmique : plafond d'une économie du bois, un virgule vingt-cinq million de tonnes par an, contre la production d'acier chinoise de deux mille huit, cinq cents millions de tonnes.</desc>
    <text x="0" y="16" font-size="12" fill="#96a09a" letter-spacing="2">TONNES PAR AN — ÉCHELLE LOGARITHMIQUE</text>
    <line x1="60" y1="30" x2="60" y2="118" stroke="#27312c"/>
    <line x1="60" y1="118" x2="630" y2="118" stroke="#27312c"/>
    <g font-size="11" fill="#5c655f" text-anchor="middle">
      <text x="60" y="134">1 M</text><line x1="60" y1="118" x2="60" y2="122" stroke="#27312c"/>
      <text x="250" y="134">10 M</text><line x1="250" y1="118" x2="250" y2="122" stroke="#27312c"/>
      <text x="440" y="134">100 M</text><line x1="440" y1="118" x2="440" y2="122" stroke="#27312c"/>
      <text x="630" y="134">1 000 M</text><line x1="630" y1="118" x2="630" y2="122" stroke="#27312c"/>
    </g>
    <!-- log10: 1,25 M → 60 + 190·log10(1,25) = 78 ; 500 M → 60 + 190·log10(500) = 572 -->
    <rect x="60" y="42" width="18" height="24" rx="3" fill="#15a869"/>
    <text x="88" y="59" font-size="13" fill="#dde3de">1,25 M t — plafond du bois (moitié de la Grande-Bretagne en forêt)</text>
    <rect x="60" y="80" width="512" height="24" rx="3" fill="#15a869"/>
    <text x="330" y="97" font-size="13" fill="#0b0d0c" font-weight="bold" text-anchor="middle">500 M t — acier, Chine, 2008</text>
    <text x="600" y="59" font-size="14" fill="#2fe08c" text-anchor="end" font-weight="bold">× 400</text>
  </svg>
  <figcaption><b>fig. 02</b> — d'après Wrigley : trente tonnes de bois par tonne de fer en barre ; l'échelle est logarithmique, sans quoi la première barre serait invisible. Le mur n'était pas moral.</figcaption>
</figure>
